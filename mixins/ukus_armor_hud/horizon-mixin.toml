# uku's Armor HUD for Horizon: a port of uku3lig/armor-hud 0.14.0+mc26.3 (MIT).
#
# Every injection is a numbered hook point (native-hooks.json, API 411): the
# bundle builds on later Nightlies without a pin. The one internal piece is
# the `peek` module (game.rs: the local player's armour, hands, selected slot,
# main arm and attack-indicator charge, an item's durability, the PLAYERS
# volume); see peek.rs for the exact fields it reads.

[mod]
id = "ukus_armor_hud"
version = "0.14.0"
priority = 100

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# The armour widget, its config, the config screen (all public helpers).
[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "ukus_armor_hud"
source = "core.rs"

# The only reads of Horizon internals.
[[module]]
id = "peek"
file = "crates/horizon-client/src/game.rs"
name = "ukus_armor_hud_peek"
source = "peek.rs"

# The armor breaking sound: the original OGG, decoded and played.
[[crate]]
id = "sound"
path = "sound"

# ArmorHudRenderer.drawArmorHud / renderMainAndOffhand and the pushes of the
# effect icons, boss bars and subtitles: around vanilla's HUD layers.
[[injection]]
id = "layer-pre"
hook = "gui_layer_pre"
hook_version = 1
kind = "HEAD"
helper = "layer_pre.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "layer", ty = "&str", value = "layer" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "layer-post"
hook = "gui_layer_post"
hook_version = 1
kind = "HEAD"
helper = "layer_post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "layer", ty = "&str", value = "layer" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# MixinMinecraft: the breaking sound, once a tick.
[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [{ name = "game", ty = "&crate::game::Game<'_>", value = "&*self" }]

# The toggle key (and the config screen's key).
[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# Closing the screen (Done, Reset), its click sound, opening it from Options.
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Options > Mods: the row, its keys and its settings page.
[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "mods.rs"
bindings = [{ name = "mods", ty = "&mut Vec<horizon_client::mod_api::NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# The config screen (ukulib's TabbedConfigScreen), drawn and driven on the
# mod's own screen.
[[injection]]
id = "screen-render"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "screen_render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "screen-press"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "screen_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen-release"
hook = "screen_mouse_button_released_pre"
hook_version = 1
kind = "HEAD"
helper = "screen_release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen-drag"
hook = "screen_mouse_dragged_pre"
hook_version = 1
kind = "HEAD"
helper = "screen_drag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen-scroll"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
kind = "HEAD"
helper = "screen_scroll.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen-key"
hook = "screen_key_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "screen_key.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen-char"
hook = "screen_char_typed_pre"
hook_version = 1
kind = "HEAD"
helper = "screen_char.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "c", ty = "char", value = "c" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Screen.extractBlurredBackground: the menu blur behind the config screen.
[[injection]]
id = "menu-background"
hook = "menu_background"
hook_version = 1
kind = "HEAD"
helper = "menu_background.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "radius", ty = "&mut Option<f32>", value = "&mut *radius" },
]
